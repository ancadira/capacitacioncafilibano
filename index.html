<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capacitación – Cafilibano</title>
<meta name="theme-color" content="#0F5A24">
<meta name="description" content="Programa de formación de Cafilibano para fieles, encargados de venta de fertilizantes y personal administrativo. Funciona con y sin internet.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--c:#1E8F3E;--c2:#0F5A24;--bg:#f6f4f1;--ink:#222;--mut:#666;--ok:#1b7f3b;--bad:#b3261e;}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5}
header{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
header img{height:54px;background:#fff;border-radius:10px;padding:4px}
header h1{font-size:16px;margin:0;line-height:1.2}
header small{opacity:.85;display:block;font-weight:400}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:18px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h2{margin:.2em 0 .5em;font-size:22px;color:var(--c2)}
h3{margin:.2em 0 .4em;font-size:18px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select{width:100%;padding:12px;font-size:17px;border:1px solid #bbb;border-radius:10px;background:#fff}
button,.btn{background:var(--c);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer;margin:6px 6px 6px 0}
button.sec{background:#fff;color:var(--c2);border:2px solid var(--c)}
button.gray{background:#777}
button:disabled{opacity:.45;cursor:not-allowed}
.mod{display:flex;gap:12px;align-items:center;border:2px solid #eee;border-radius:12px;padding:12px;margin:10px 0}
.mod.done{border-color:var(--ok);background:#f2faf4}
.mod.lock{opacity:.55}
.badge{min-width:42px;height:42px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.mod.done .badge{background:var(--ok)}
.bar{height:12px;background:#e5e0da;border-radius:8px;overflow:hidden;margin:6px 0 10px}
.bar>div{height:100%;background:var(--c)}
.tip{background:#fff8e1;border-left:5px solid #f5b400;padding:10px 12px;border-radius:8px;margin:12px 0}
.alert{background:#fdecea;border-left:5px solid var(--bad);padding:10px 12px;border-radius:8px;margin:12px 0}
code{background:#f1eee9;padding:2px 6px;border-radius:6px;font-size:.95em}
table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:8px;text-align:left}th{background:#f1eee9}
details{border:1px solid #e3dfd9;border-radius:12px;margin:10px 0;background:#fff}
summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
.lbody{padding:0 14px 14px}
.read{color:var(--ok);font-weight:700}
.q{border:1px solid #e6e1da;border-radius:12px;padding:12px;margin:12px 0}
.q.ok{border-color:var(--ok);background:#f2faf4}.q.bad{border-color:var(--bad);background:#fdf3f2}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:8px;cursor:pointer}
.opt input{width:22px;height:22px;margin-top:3px}
.exp{font-size:15px;margin-top:6px;color:#333}
.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0}.chk input{width:24px;height:24px;margin-top:2px}
.codebox{font-family:ui-monospace,Consolas,monospace;font-size:24px;letter-spacing:1px;background:#111;color:#fff;border-radius:12px;padding:14px;text-align:center;margin:10px 0;word-break:break-all}
.small{font-size:14px;color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap}
footer{max-width:860px;margin:0 auto;padding:0 16px 30px;color:var(--mut);font-size:13px}
a{color:var(--c2)}
/* aplicación: ventanas y estado */
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#dlg.on{display:flex}
#dlg .box{background:#fff;border-radius:14px;padding:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#dlg textarea{width:100%;min-height:150px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:13px;border:1px solid #bbb;border-radius:10px;word-break:break-all}
#dlg p{white-space:pre-line}
.appbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;background:#e9f5ec;color:var(--c2)}
.pill.off{background:#fff3cd;color:#7a5b00}
/* certificado */
#cert{background:#fff;border:10px double var(--c);padding:28px 36px;text-align:center;margin:14px 0}
#cert img.logo{height:90px}
#cert h1{font-size:34px;margin:6px 0 2px;color:var(--c2);letter-spacing:2px}
#cert .nm{font-size:30px;font-weight:700;border-bottom:2px solid #999;display:inline-block;padding:0 24px;margin:10px 0}
#cert table{font-size:14px;margin:12px auto;width:auto}
#cert .firma{display:flex;justify-content:center;gap:60px;margin-top:26px}
#cert .firma div{min-width:260px}
#cert .firma .ln{border-top:1px solid #000;margin-top:56px;padding-top:4px}
#cert .firma img{height:64px;margin-bottom:-52px;position:relative}
.vcode{font-family:ui-monospace,Consolas,monospace;font-size:13px;margin-top:14px}
@page{size:A4 landscape;margin:10mm}
@media print{body{background:#fff}header,footer,#noprint,.noprint,#dlg{display:none!important}main{max-width:none;padding:0}#cert{margin:0;border-width:8px;padding:10px 24px;page-break-inside:avoid;font-size:12.5px;line-height:1.35}#cert img.logo{height:62px}#cert h1{font-size:26px;margin:2px 0}#cert .nm{font-size:22px;margin:4px 0}#cert table{font-size:11px;margin:6px auto}#cert td{padding:3px 8px}#cert .firma .ln{margin-top:34px}#cert .firma img{height:46px;margin-bottom:-38px}#cert .small,#cert .vcode{font-size:11px;margin-top:8px}}
</style>
</head>

<script>
const COOP={"id": "cafilibano", "sigla": "CL", "corto": "Cafilibano", "nombre": "Cooperativa de Caficultores del Líbano – CAFILIBANO", "nit": "890700815-9", "ciudad": "Líbano, Tolima", "gerente": "Ferdinando Palacio Jiménez", "pos": "el sistema de información de la cooperativa", "puntos": ["Bodega Sede – Líbano", "Fielato Líbano", "Fielato Dos – Líbano", "Fielato Convenio – Líbano", "Fielato Santa Isabel", "Fielato Murillo", "Fielato Villahermosa", "Fielato Casabianca", "Oficina administrativa – Líbano"]}, MODS=[{"id": 1, "h": 2, "titulo": "Somos cooperativa: identidad, ética y reglas de juego", "objetivo": "Reconocer qué es {{corto}}, cuáles son mis deberes éticos y cómo actuar frente a señales de fraude o lavado de activos.", "lecciones": [{"t": "1. La cooperativa y su razón de ser", "h": "<p>{{corto}} es una <b>cooperativa de caficultores</b>: una empresa de propiedad de sus <b>asociados</b>, los productores de café de la región. No existe para enriquecer a un dueño, sino para dar a los asociados un comprador seguro para su café, insumos a buen precio, crédito y asistencia.</p>\n<p>Los siete principios cooperativos son: <b>adhesión voluntaria y abierta</b>, <b>gestión democrática</b> (un asociado, un voto), <b>participación económica</b> de los asociados, <b>autonomía e independencia</b>, <b>educación, formación e información</b>, <b>cooperación entre cooperativas</b> e <b>interés por la comunidad</b>.</p>\n<div class=\"tip\"><b>Lo que esto significa para usted:</b> quien llega a su punto es, muchas veces, dueño de la cooperativa. Usted es la cara de {{corto}} frente a él. Cada pesaje, cada factura y cada saludo construyen o destruyen la confianza.</div>"}, {"t": "2. Código de ética y buen gobierno", "h": "<p>El Código de Ética y Buen Gobierno de {{corto}} es de obligatorio cumplimiento para todos los colaboradores, sin perjuicio de los estatutos, las leyes y los reglamentos que vigilan la cooperativa. En la práctica se resume en cinco reglas:</p>\n<ul><li><b>Honestidad:</b> los recursos de la cooperativa se usan solo para la cooperativa.</li>\n<li><b>Imparcialidad:</b> a todos los productores se les califica, pesa y paga con las mismas reglas.</li>\n<li><b>Conflicto de intereses:</b> si usted, un familiar o un amigo tiene un interés personal en una operación, lo declara y no decide solo.</li>\n<li><b>Regalos y favores:</b> no se reciben dádivas que puedan comprometer su criterio (precio, peso, calidad, descuentos, crédito).</li>\n<li><b>Confidencialidad:</b> la información de asociados, precios, saldos e inventarios no se comparte con terceros ni con la competencia.</li></ul>"}, {"t": "3. Señales de alerta: fraude y lavado de activos", "h": "<p>La cooperativa debe prevenir el lavado de activos y la financiación del terrorismo, y contar con programas de transparencia y ética empresarial. Usted es la primera línea: ve a las personas y las operaciones.</p>\n<p><b>Señales de alerta en un punto de compra o de venta:</b></p>\n<ul><li>Una persona se niega a identificarse o presenta documentos que no parecen suyos.</li>\n<li>Alguien quiere cobrar café “a nombre de varios productores” sin poder explicar de dónde viene.</li>\n<li>Pagos o compras en efectivo muy altos, fraccionados para no dejar registro.</li>\n<li>Cantidades de café que no corresponden al tamaño de la finca declarada.</li>\n<li>Presiones para “no dejar factura” o para cambiar el nombre del beneficiario.</li></ul>\n<div class=\"alert\"><b>Qué hacer:</b> no acuse a nadie ni lo enfrente. Complete la operación según el procedimiento, <b>documente lo que vio</b> y repórtelo el mismo día a su jefe inmediato o al funcionario que la cooperativa designe para el control de estos riesgos.</div>"}, {"t": "4. Cumplir el reglamento y reportar lo irregular", "h": "<p>El Reglamento Interno de Trabajo y el Sistema de Seguridad y Salud en el Trabajo (SG-SST) hacen parte de su contrato. Cumplirlos le protege a usted.</p>\n<p>Si ve una conducta irregular con dinero, inventarios o documentos (de un compañero o de un tercero), la regla es sencilla: <b>no la encubra, no la difunda como rumor, repórtela por el canal formal</b> (jefe inmediato, gerencia, Junta de Vigilancia o Revisoría Fiscal). Callar también lo hace responsable ante la cooperativa.</p>\n<div class=\"tip\"><b>Regla de oro del control interno:</b> lo que no está documentado, para efectos prácticos, no ocurrió.</div>"}], "practica": ["Ubiqué en mi punto el Código de Ética y Buen Gobierno (impreso o digital) y leí los valores y las conductas prohibidas.", "Identifiqué con mi jefe inmediato a quién debo reportar una operación sospechosa o una irregularidad.", "Revisé que en mi punto no haya dinero personal mezclado con el de la cooperativa."], "quiz": [{"q": "¿Quiénes son los dueños de la cooperativa?", "o": ["El gerente", "Los asociados", "La Federación Nacional de Cafeteros", "Los empleados"], "a": 1, "e": "Una cooperativa es propiedad de sus asociados; la gerencia la administra por mandato de ellos."}, {"q": "Un caficultor le ofrece un regalo para que “le ayude” con el peso o la calidad de su café. ¿Qué debe hacer?", "o": ["Aceptarlo si el valor es pequeño", "Aceptarlo y repartirlo con el equipo", "Rechazarlo y reportarlo a su jefe inmediato", "Aceptarlo solo si es un asociado"], "a": 2, "e": "Los regalos que pueden comprometer el criterio se rechazan y se reportan. La imparcialidad es obligatoria."}, {"q": "Una persona quiere cobrar café a nombre de varios productores y no puede explicar de dónde viene. Esto es:", "o": ["Una operación normal si paga la factura", "Una señal de alerta que se documenta y se reporta", "Un problema solo del cliente", "Algo que se resuelve negándole el servicio sin avisar a nadie"], "a": 1, "e": "Son señales de alerta: se completa el procedimiento, se documenta y se reporta el mismo día."}, {"q": "¿Cuál NO es un principio cooperativo?", "o": ["Gestión democrática de los asociados", "Educación, formación e información", "Maximizar la utilidad personal del administrador del punto", "Interés por la comunidad"], "a": 2, "e": "Los recursos de la cooperativa no se administran para beneficio personal."}, {"q": "Usted nota que un compañero maneja de forma irregular el dinero de un punto. Lo correcto es:", "o": ["Callar para no tener problemas", "Comentarlo con los productores", "Reportarlo por el canal formal (jefe, gerencia, Junta de Vigilancia o Revisoría Fiscal)", "Esperar a que se note solo"], "a": 2, "e": "Se reporta por el canal formal; encubrir o difundir rumores perjudica a todos."}]}, {"id": 2, "h": 3, "titulo": "Mis funciones y responsabilidades en el punto", "objetivo": "Conocer con precisión las funciones y los niveles de responsabilidad de mi cargo, y los documentos que debo producir.", "lecciones": [{"t": "1. Propósito de mi cargo", "for": ["fiel"], "h": "<p>El <b>fiel</b> (administrador del punto de compra o “fielato”) atiende todo lo relacionado con la <b>comercialización del café</b> en su punto, aplicando la metodología de recibo y calidad adoptada por {{corto}} y las normas de los sellos y certificaciones con que cuente la cooperativa.</p>\n<p>Su trabajo es el momento donde el productor entrega su cosecha y la cooperativa entrega su dinero: <b>el punto más sensible de toda la operación</b>.</p>"}, {"t": "2. Funciones del fiel: de la compra al pago", "for": ["fiel"], "h": "<ol><li><b>Recibir, pesar, examinar y calificar</b> el café con la metodología de la cooperativa.</li>\n<li><b>Liquidar y facturar</b> la compra, y pagar al productor, quien <b>firma la factura de compra</b>.</li>\n<li><b>Atender personalmente</b> a productores, asociados o no asociados, e informar sobre beneficio del café, precio del día, horario, programas y condiciones de calidad.</li>\n<li><b>Custodiar y administrar</b> el dinero asignado al punto, rendir cuentas con conciliaciones y soportes.</li>\n<li><b>Cuidar la bodega</b>: empaque, arrume, seguridad, capacidad y despacho del café (a la trilladora, a Almacafé o donde se ordene).</li>\n<li><b>Informar</b> a la gerencia y a la dirección comercial las eventualidades, el ingreso de personal temporal y las acciones de la competencia.</li>\n<li>Mantener los equipos (báscula, humedímetro, trilla de muestra) en perfecto estado y <b>colaborar con los organismos de control</b> y la Revisoría Fiscal.</li></ol>"}, {"t": "3. El factor de rendimiento, paso a paso", "for": ["fiel"], "h": "<p>El <b>factor de rendimiento</b> expresa cuántos kilos de café pergamino seco se necesitan para obtener 70 kg de café excelso (almendra sana). Con él se define el precio que se paga al productor. Tome siempre el procedimiento vigente de {{corto}} como regla final; este es el esquema general:</p>\n<ol><li>Tome una <b>muestra de 250 g</b> y mida el <b>porcentaje de humedad</b>.</li>\n<li><b>Trille</b> la muestra y pese la almendra total sin despasillar; calcule la merma.</li>\n<li><b>Tamice</b> la almendra y pese la <b>almendra sana</b>.</li>\n<li>Calcule: <code>Factor = 70 × peso de la muestra ÷ peso de la almendra sana</code>.</li></ol>\n<div class=\"tip\"><b>Ejemplo:</b> muestra 250 g, almendra sana 186 g → Factor = 70 × 250 ÷ 186 = <b>94,1</b>. Mientras menos almendra sana rinde la muestra, mayor es el factor y menor el precio por kilo.</div>\n<p>Por eso el productor tiene derecho a <b>ver el procedimiento</b> y usted el deber de explicarlo con transparencia.</p>"}, {"t": "1. Propósito de mi cargo", "for": ["fert"], "h": "<p>El <b>encargado de venta de fertilizantes</b> (administrador del almacén agropecuario o del punto de insumos) atiende todo lo relacionado con la <b>organización, administración y control del almacén</b>: pedido y recibo de mercancías, marcación de precios, venta, manejo de dinero, crédito y compras delegadas.</p>\n<p>Su misión comercial es doble: que el caficultor encuentre el insumo correcto a tiempo y que la cooperativa venda con margen, sin perder inventario ni dinero.</p>"}, {"t": "2. Funciones del encargado de venta de fertilizantes", "for": ["fert"], "h": "<ol><li><b>Planificar</b> con la dirección comercial las actividades y metas del almacén.</li>\n<li><b>Promocionar</b> permanentemente los productos y estudiar los precios del mercado en el municipio.</li>\n<li><b>Identificar necesidades</b> de los clientes y asesorarlos al momento de la compra.</li>\n<li><b>Mantener existencias</b> adecuadas: pedir a tiempo para evitar quiebres de inventario en los productos críticos.</li>\n<li><b>Recibir la mercancía</b> verificando remisión contra pedido: cantidad, calidad y fechas de vencimiento; ingresarla al sistema ({{pos}}) con la factura del proveedor.</li>\n<li><b>Rotar</b> los productos y vigilar vencimientos; informar los próximos a vencer.</li>\n<li><b>Organizar</b> la bodega de reposición y reempacar lo que se haya deteriorado.</li>\n<li><b>Hacer inventario semanal</b> y dejar evidencia (soporte del conteo y reporte del sistema).</li>\n<li><b>Entregar pedidos</b> verificando la compra con el cliente y entregando la <b>factura original</b>.</li>\n<li><b>Despachar y registrar traslados</b> a otros puntos con su respectivo soporte en el sistema.</li>\n<li><b>Atender reclamos</b> y sugerencias de productores, clientes y asociados.</li></ol>"}, {"t": "3. Productos deteriorados, vencidos y traslados", "for": ["fert"], "h": "<p>Un producto <b>deteriorado o vencido no se bota, no se regala y no se vende</b>. El procedimiento es:</p>\n<ol><li>Informar a la dirección comercial el estado del producto.</li>\n<li>Elaborar el <b>documento de baja en el sistema</b>, con autorización de la dirección comercial.</li>\n<li>Gestionar el cambio con el proveedor, que es quien asume el costo, dejando evidencia (fotos, actas, correos).</li>\n<li>Guardar copia del documento en el archivo del punto.</li></ol>\n<p>Los <b>traslados</b> entre puntos se registran en el sistema con cantidad, producto y quién recibe. Nunca se mueve mercancía “de palabra”.</p>"}, {"t": "4. Niveles de responsabilidad: de qué respondo yo", "h": "<ul><li>Soy responsable de la <b>correcta administración del punto</b> a mi cargo: existencias, llaves, información y dinero. <b>Esta responsabilidad no se delega</b>: puedo apoyarme en auxiliares, pero sigo respondiendo por lo que ocurra.</li>\n<li>Soy responsable de la <b>veracidad de la información</b> que reporto (arqueos, inventarios, cierres).</li>\n<li>Soy responsable de cumplir las normas del SG-SST y de usar los elementos de protección entregados.</li>\n<li>Soy responsable de garantizar una <b>imagen de calidad y seriedad</b> de {{corto}} frente a la comunidad.</li></ul>\n<div class=\"alert\">Entregar el punto, las llaves o el dinero a otra persona <b>sin acta, conteo y firma</b> puede dejarlo a usted respondiendo por faltantes que no causó.</div>"}], "practica": ["Escribí en una hoja las 5 funciones que más hago en el día y verifiqué cuáles de ellas están en el manual de funciones de mi cargo.", "Revisé si en mi punto tengo a la vista el precio del día, los horarios y los datos de contacto de la cooperativa.", "Verifiqué que tengo claro quién es mi jefe inmediato y a quién informo cada novedad."], "quiz_comun": [{"q": "La responsabilidad por las existencias, las llaves y el dinero de mi punto:", "o": ["Se transfiere a mi auxiliar cuando yo no estoy", "Sigue siendo mía aunque tenga auxiliares, y debo entregar con acta", "Es solo de la gerencia", "Es del vigilante"], "a": 1, "e": "Puede apoyarse en auxiliares, pero la responsabilidad del punto no se delega; las entregas se hacen con acta y conteo."}, {"q": "Entre las tareas obligatorias del cargo está informar:", "o": ["Solo las ventas del día", "Las eventualidades del trabajo y las acciones de la competencia", "Nada, la gerencia se entera sola", "Solo los problemas con empleados"], "a": 1, "e": "Informar eventualidades y movimientos de la competencia es función explícita del cargo."}], "quiz_fiel": [{"q": "En la compra de café, el documento que debe firmar el productor es:", "o": ["Un pagaré", "La factura de compra", "Una carta de intención", "No debe firmar nada"], "a": 1, "e": "La factura de compra firmada por el productor es soporte esencial del pago."}, {"q": "El factor de rendimiento indica:", "o": ["Los kilos de pergamino seco necesarios para obtener 70 kg de café excelso", "El precio de la carga", "El porcentaje de humedad del café", "El número de sacos por finca"], "a": 0, "e": "Es la relación entre el pergamino seco comprado y el excelso (almendra sana) que rinde."}, {"q": "Muestra de 250 g y almendra sana de 186 g. El factor de rendimiento es aproximadamente:", "o": ["74,4", "94,1", "70,0", "134,4"], "a": 1, "e": "Factor = 70 × 250 ÷ 186 = 94,1."}], "quiz_fert": [{"q": "Al recibir mercancía de un proveedor se debe verificar la remisión contra el pedido en:", "o": ["Solo el valor total", "Cantidad, calidad y fechas de vencimiento", "Solo el color del empaque", "Nada, se confía en el transportador"], "a": 1, "e": "Se confronta la remisión con el pedido (cantidad, calidad, vencimientos) antes de ingresar al sistema."}, {"q": "Un producto deteriorado debe:", "o": ["Botarse sin más", "Venderse con descuento", "Darse de baja con documento en el sistema y autorización, y gestionar el cambio con el proveedor", "Guardarse en el fondo de la bodega"], "a": 2, "e": "Se documenta, se autoriza y se gestiona el cambio con evidencia."}, {"q": "El inventario físico del almacén debe hacerse con frecuencia:", "o": ["Anual", "Semanal, dejando evidencia del conteo y del reporte del sistema", "Cuando haya visita de la Revisoría", "Nunca, el sistema es suficiente"], "a": 1, "e": "El inventario semanal con soporte es una función del cargo."}]}, {"id": 3, "h": 3, "titulo": "Control interno: dinero, inventarios y documentos", "objetivo": "Aplicar el arqueo diario, la separación de fondos, el conteo de inventarios y el manejo documental, y saber qué hacer ante una diferencia.", "lecciones": [{"t": "1. Por qué el control interno lo protege a usted", "h": "<p>El control interno no es desconfianza: es la <b>evidencia que demuestra que usted hizo bien su trabajo</b>. Un punto con arqueos diarios, inventarios soportados y documentos completos es un punto donde una diferencia se detecta el mismo día, se explica y se corrige, en lugar de crecer en silencio durante meses.</p>\n<p>Tres ideas guían todo el módulo: <b>separar</b> (cada dinero y cada documento en su lugar), <b>contar</b> (arqueos e inventarios regulares) y <b>dejar rastro</b> (todo con soporte y firma).</p>"}, {"t": "2. El arqueo diario: cómo se hace y cómo se lee", "h": "<ol><li>Al <b>cierre de cada día con operación</b>, cuente físicamente billetes y monedas por denominación.</li>\n<li>Obtenga el <b>saldo en libros</b> (lo que dice el sistema o el registro del punto).</li>\n<li>Calcule la diferencia con una sola regla: <code>Diferencia = Total arqueo − Saldo en libros</code>.</li>\n<li>Interprete: <b>negativo = FALTANTE</b>; <b>positivo = SOBRANTE</b>; cero = cuadrado.</li>\n<li>Use <b>siempre el mismo formato</b> y reporte el cierre cada día, con evidencia (archivo del arqueo y, si se pide, foto).</li>\n<li>Los <b>días en que el punto no abre se informan</b>.</li></ol>\n<div class=\"tip\"><b>Ejemplo:</b> Arqueo $1.850.000 − Libros $1.935.000 = −$85.000 → <b>faltante de $85.000</b>. No se compensa con otro día ni con otro fondo: se investiga y se reporta.</div>"}, {"t": "3. Separar los fondos y nunca compensar", "h": "<p>El dinero de la cooperativa puede provenir de <b>fuentes distintas</b> (por ejemplo, recursos propios, recursos de líneas de financiamiento o de convenios, dinero de ventas). Cada uno tiene su registro, su saldo y su destino. Por eso:</p>\n<ul><li>Cada fondo va <b>físicamente separado</b> (cajón, bolsa o caja distinta) y se registra por aparte.</li>\n<li><b>Nunca</b> se usa dinero de un fondo para cubrir el faltante de otro, ni se compensan sobrantes con faltantes: cada diferencia se explica por separado.</li>\n<li>No se mezcla dinero personal con el de la cooperativa, no se prestan dineros ni se aceptan <b>vales</b> como si fueran efectivo.</li>\n<li>El dinero se entrega, consigna o traslada <b>solo con comprobante</b>: fecha, valor, quién entrega y quién recibe.</li></ul>"}, {"t": "4. Inventarios: conteo físico contra sistema", "for": ["fert"], "h": "<ul><li><b>Conteo semanal</b> de los productos a su cargo, comparando existencias físicas contra el reporte del sistema; guarde el soporte firmado.</li>\n<li>Empiece por los productos de <b>mayor valor y mayor rotación</b>.</li>\n<li>Si el físico y el sistema no coinciden: <b>recuente</b>, revise entradas, salidas, traslados y facturas del periodo y <b>reporte</b>. Usted no “ajusta” por su cuenta: el ajuste lo autoriza quien corresponda.</li>\n<li>Identifique <b>quiebres</b> (agotados) y <b>excesos</b> (productos sin rotación o próximos a vencer) y repórtelos.</li></ul>"}, {"t": "4. Bodega y existencias de café", "for": ["fiel"], "h": "<ul><li>Conozca en todo momento <b>cuánto café hay en su bodega</b> por tipo y calidad, y concílielo con lo comprado menos lo despachado.</li>\n<li>Los <b>despachos</b> (a Almacafé, a trilladora o a otro destino) salen con documento, peso, placa y firma de quien recibe; conserve copia.</li>\n<li>Las <b>llaves y claves</b> de bodega, caja y sistema son personales; no se prestan.</li>\n<li>Cualquier diferencia entre el café físico y el registrado se reporta el mismo día con el soporte de pesaje.</li></ul>"}, {"t": "5. Documentos: sin soporte no hay operación", "h": "<ul><li>Toda venta o compra tiene <b>factura o documento equivalente</b> según el sistema de la cooperativa; al cliente se le entrega el original.</li>\n<li>Conserve en orden: facturas de compra firmadas, recibos de caja, remisiones, traslados, bajas de inventario, arqueos y consignaciones.</li>\n<li>Los <b>consecutivos</b> no se saltan ni se anulan sin autorización y soporte.</li>\n<li>Archive por fecha y punto; la Revisoría Fiscal y los organismos de control pueden solicitar estos soportes en cualquier momento.</li></ul>"}, {"t": "6. Protocolo ante una diferencia", "h": "<ol><li><b>Pare y recuente</b> con calma, preferiblemente con un testigo.</li>\n<li><b>Revise</b> los documentos del día: facturas, pagos, devoluciones, traslados, entregas de dinero.</li>\n<li><b>Reporte el mismo día</b> a su jefe inmediato con las evidencias; no espere a cuadrar “más adelante”.</li>\n<li><b>No oculte ni compense</b> la diferencia con dinero de otro fondo, de otro día o personal sin reportarla.</li>\n<li>Siga la decisión de la cooperativa: cuando una diferencia <b>no tiene soporte</b>, se aplican el reintegro y el procedimiento previsto en el Reglamento Interno de Trabajo.</li></ol>\n<div class=\"alert\">Una diferencia pequeña pero repetida todos los días es una señal de alerta tan importante como una diferencia grande.</div>"}, {"t": "7. Lo que nos mostró la Revisoría Fiscal: reporte diario de cierre de efectivo", "h": "<p>En {{corto}} la Revisoría Fiscal pidió a los puntos de compra reportar <b>cada día con operación</b> el cierre de efectivo, separando la <b>Línea de Financiamiento (LF)</b> y los <b>Recursos Propios (RP)</b>. Del seguimiento se concluyó que hay que reforzar cuatro hábitos:</p>\n<ol><li><b>Un solo formato de arqueo</b> y una sola regla de cálculo (Arqueo − Libros) en todos los puntos.</li>\n<li><b>Todos los días con operación</b>, el arqueo con saldo en libros y en el formato, no solo la foto.</li>\n<li><b>Separar LF y RP</b> en dos cajones y dos registros; nunca compensar entre fondos.</li>\n<li><b>Informar los días en que el punto no abre</b> y estar preparado para <b>arqueos sorpresivos</b> mensuales.</li></ol>\n<div class=\"alert\">Diferencias que no tengan soporte pueden terminar en reintegro y en procedimiento disciplinario según el Reglamento Interno de Trabajo. El mejor seguro es el reporte puntual y completo.</div>"}], "practica": ["Hice un arqueo completo hoy con el formato de la cooperativa, calculé Arqueo − Libros y verifiqué si hubo faltante o sobrante.", "Revisé que cada fondo de dinero de mi punto esté físicamente separado y rotulado.", "Verifiqué que mis documentos del último mes (facturas, recibos, traslados o arqueos) estén archivados por fecha."], "quiz_comun": [{"q": "Arqueo del día: $1.850.000. Saldo en libros: $1.935.000. ¿Cuál es la diferencia y qué significa?", "o": ["+$85.000, sobrante", "−$85.000, faltante", "$0, cuadrado", "−$85.000, sobrante"], "a": 1, "e": "Diferencia = Arqueo − Libros = −$85.000 → faltante."}, {"q": "Hay un sobrante en un fondo y un faltante en otro. ¿Qué se hace?", "o": ["Se compensan entre sí para que quede en cero", "Se explica y reporta cada diferencia por separado", "Se espera al fin de mes", "Se gasta el sobrante"], "a": 1, "e": "Los fondos no se compensan entre sí: cada diferencia se investiga y se reporta por separado."}, {"q": "Al encontrar una diferencia al cierre lo correcto es:", "o": ["Taparla con dinero propio sin avisar", "Recontar, revisar los documentos del día y reportarla el mismo día", "Reportarla cuando la Revisoría llegue", "Cambiar la cifra del arqueo"], "a": 1, "e": "Se recuenta, se revisa y se reporta el mismo día con evidencia."}], "quiz_fiel": [{"q": "Los días en que el punto de compra no abre:", "o": ["No se dice nada", "Se informa a la cooperativa", "Se llena el arqueo igual", "Se abre solo para el arqueo"], "a": 1, "e": "Los días sin atención se informan; el silencio impide el control."}, {"q": "Los despachos de café a Almacafé o trilladora deben salir con:", "o": ["Autorización verbal", "Documento con peso, placa y firma de quien recibe, y copia para el punto", "Solo la placa", "Solo la foto de la carga"], "a": 1, "e": "Todo despacho se soporta con documento firmado y copia."}], "quiz_fert": [{"q": "El conteo físico no coincide con el reporte del sistema. Usted:", "o": ["Ajusta el sistema para que coincida", "Recuenta, revisa entradas, salidas y traslados, y reporta; el ajuste lo autoriza quien corresponde", "Espera a que el proveedor reclame", "Vende primero lo que falta"], "a": 1, "e": "Los ajustes no se hacen por cuenta propia: se investiga, se reporta y se autoriza."}, {"q": "Cuando entrega dinero de ventas a otro funcionario autorizado de la cooperativa:", "o": ["Basta con avisarle", "Se registra con comprobante: fecha, valor, quién entrega y quién recibe", "Se espera al cierre del mes", "Se anota en un papel suelto"], "a": 1, "e": "Toda entrega de dinero requiere comprobante con fecha, valor y firmas."}]}, {"id": 4, "h": 2, "titulo": "Atención al cliente: cómo tratar al caficultor", "objetivo": "Aplicar un esquema de atención respetuoso, transparente y eficaz, y manejar quejas y reclamos sin perder al cliente.", "lecciones": [{"t": "1. Quién es nuestro cliente", "h": "<p>Nuestro cliente es el <b>asociado</b>, el <b>productor no asociado</b> y la <b>comunidad</b> en general. El mismo caficultor puede llegar hoy a vender su café, mañana a comprar abono y pasado mañana a pedir un crédito. Si lo atiende bien una vez, vuelve a todo; si lo atiende mal una vez, se lo lleva la competencia en todo.</p>\n<div class=\"tip\">Un cliente satisfecho se lo cuenta a 3 vecinos. Un cliente maltratado se lo cuenta a 10.</div>"}, {"t": "2. Cinco pasos de una atención de calidad", "h": "<ol><li><b>Salude</b> con nombre si lo conoce (“Buenos días, don Pedro”), mire a los ojos y sonría.</li>\n<li><b>Escuche</b> sin interrumpir: deje que el cliente explique qué necesita.</li>\n<li><b>Pregunte</b> para entender (¿para cuántos árboles?, ¿qué cantidad trae?, ¿tiene fecha de entrega?).</li>\n<li><b>Resuelva o explique</b> con claridad: precio, tiempos, condiciones. Si no puede resolver, dígalo y diga quién sí.</li>\n<li><b>Despídase</b> confirmando que quedó satisfecho y agradeciendo su confianza.</li></ol>\n<p>Trato siempre respetuoso: “don”, “doña”, “usted”, lenguaje sencillo, sin tecnicismos ni tono de superioridad.</p>"}, {"t": "3. Transparencia: mostrar para generar confianza", "h": "<ul><li>Tenga <b>visibles</b> el precio del día, el horario y los productos con su precio marcado.</li>\n<li>Haga el pesaje, la medición de humedad y las cuentas <b>a la vista del cliente</b>, y explíquelas.</li>\n<li>Entregue siempre <b>copia de la factura o documento</b> y revise con el cliente que los datos estén bien.</li>\n<li>Trate igual a todos: mismas reglas para el grande y para el pequeño, para el asociado y para el que no lo es.</li></ul>\n<p>La transparencia no es solo ética: es la mejor estrategia comercial. Un productor que ve cómo se hace su cuenta, no desconfía.</p>"}, {"t": "4. Quejas y reclamos: convertirlos en oportunidad", "h": "<ol><li><b>Escuche completo</b>, sin discutir ni interrumpir.</li>\n<li><b>Muestre empatía</b>: “entiendo su molestia, vamos a revisarlo”.</li>\n<li><b>Verifique con hechos</b>: pesaje, factura, remisión, registro.</li>\n<li><b>Resuelva</b> lo que está a su alcance o <b>escale</b> con su jefe sin dejar al cliente esperando sin respuesta.</li>\n<li><b>Registre</b> el reclamo y haga seguimiento hasta cerrarlo.</li></ol>\n<div class=\"alert\">No prometa lo que no puede cumplir (“mañana llega el abono”) si no tiene certeza. Es mejor dar una fecha realista que una promesa rota.</div>"}, {"t": "5. Datos personales, WhatsApp y presentación", "h": "<ul><li>Para guardar el número o los datos del cliente y escribirle por WhatsApp, pida <b>autorización</b> y dígale para qué los usará (Ley 1581 de 2012, protección de datos personales).</li>\n<li>Use WhatsApp con horario razonable, mensajes cortos y claros, sin cadenas ni información de otros clientes.</li>\n<li>Presentación personal, uniforme o distintivo de {{corto}} si lo hay, punto limpio y ordenado.</li>\n<li>Ante un cliente molesto: voz baja, calma, mirada atenta y foco en la solución; si se vuelve agresivo, retírese con respeto y llame a su jefe.</li></ul>"}], "practica": ["Observé durante un día cuántas veces saludé por su nombre al cliente y cuántas veces expliqué un precio o una cuenta.", "Revisé que en mi punto estén a la vista el precio del día (o los precios de los productos) y el horario.", "Anoté un reclamo o sugerencia reciente de un cliente y qué hice para resolverlo."], "quiz_comun": [{"q": "Ante un reclamo, el primer paso es:", "o": ["Defender el punto", "Escuchar completo, sin interrumpir ni discutir", "Pasar el reclamo a otro compañero", "Pedir que vuelva mañana"], "a": 1, "e": "Escuchar completo baja la tensión y permite entender qué pasó."}, {"q": "Un productor duda del peso o de la cuenta. Lo mejor es:", "o": ["Decirle que así se hace siempre", "Mostrarle y explicarle el pesaje o la cuenta con transparencia", "Ignorarlo", "Subir la voz"], "a": 1, "e": "Mostrar y explicar genera confianza y evita conflictos."}, {"q": "El cliente pregunta cuándo llega un producto y usted no tiene certeza. Lo correcto es:", "o": ["Prometer una fecha para tranquilizarlo", "Decirle que lo va a verificar y avisarle una fecha realista", "Decirle que no sabe y cambiar de tema", "Pedirle que lo busque en otro lado"], "a": 1, "e": "Es mejor una fecha realista que una promesa rota."}, {"q": "Para guardar el número de WhatsApp de un cliente y escribirle, debe:", "o": ["Guardarlo sin avisar", "Pedirle autorización y decirle para qué se usará", "Compartirlo con otros clientes", "Venderlo"], "a": 1, "e": "La Ley 1581 de 2012 exige autorización informada para tratar datos personales."}, {"q": "Un cliente molesto levanta la voz. Usted:", "o": ["Le responde igual", "Mantiene la calma, baja el tono y se enfoca en la solución", "Se ríe", "Lo ignora"], "a": 1, "e": "La calma y la empatía desescalan la situación."}]}, {"id": 5, "h": 3, "titulo": "Organización del punto, almacenamiento y seguridad", "objetivo": "Organizar el punto de compra o de venta para ser eficiente, seguro y ordenado, almacenando el café y los fertilizantes correctamente.", "lecciones": [{"t": "1. Un punto ordenado vende y protege", "h": "<p>Un punto bien organizado ahorra tiempo, evita pérdidas, previene accidentes y proyecta confianza. Cuatro reglas que valen para todos:</p>\n<ul><li><b>Un lugar para cada cosa</b> y cada cosa en su lugar, con rótulos claros.</li>\n<li><b>Zonas definidas</b>: recibo, almacenamiento, atención/caja, salida; sin cruces ni cuellos de botella.</li>\n<li><b>Limpieza diaria</b>: piso, mostrador, báscula, equipos.</li>\n<li><b>Vías despejadas</b> y señalización visible (salidas, extintor, prohibido fumar, EPP).</li></ul>"}, {"t": "2. Almacenamiento seguro de insumos y café", "h": "<ul><li><b>Nunca almacene café junto a fertilizantes, agroquímicos, combustibles o productos con olor fuerte</b>: el café absorbe olores y se contamina; además se pierde su valor.</li>\n<li>Los bultos van sobre <b>estibas o tarimas</b>, nunca directamente en el piso, y separados de las paredes para ventilar.</li>\n<li>Respete la <b>altura máxima de estibas</b> y la distancia entre ellas definidas por Seguridad y Salud en el Trabajo; evite derrumbes.</li>\n<li>Mantenga la bodega <b>seca, ventilada y protegida</b> del sol y la lluvia.</li>\n<li>Revise el estado de la bodega: goteras, humedad, plagas, capacidad y seguridad. Repórtelo.</li></ul>"}, {"t": "3. Organización de la zona de recibo y bodega de café", "for": ["fiel"], "h": "<ol><li><b>Flujo ordenado:</b> recibo → pesaje → toma de muestra → análisis → liquidación → pago → arrume. Evite que el café ya pagado se mezcle con el que aún no se ha calificado.</li>\n<li><b>Separe por calidades, lotes y sellos</b> (por ejemplo cafés certificados o verificados) para conservar la trazabilidad: sabe qué café es, de quién vino y en qué lote está.</li>\n<li>Marque los lotes con fecha, peso y origen.</li>\n<li>Mantenga <b>limpios y calibrados</b> báscula, humedímetro y equipos de trilla de muestra.</li>\n<li>Conserve el área de pago ordenada, con la caja bajo llave y fuera de la vista del público.</li></ol>"}, {"t": "3. Cómo organizar el almacén agropecuario", "for": ["fert"], "h": "<ul><li><b>Zonifique:</b> recepción de mercancía, bodega de reposición, exhibición y caja.</li>\n<li>Organice por <b>familia de producto</b>: fertilizantes edáficos, foliares, enmiendas, herramientas, otros. Rotule los pasillos.</li>\n<li><b>Ubique lo que más se vende</b> a la altura de las manos y a la vista; lo pesado, abajo; lo liviano o de menor rotación, arriba.</li>\n<li><b>Marque el precio</b> en cada producto, visible y actualizado.</li>\n<li>Aplique <b>FEFO/PEPS</b>: sale primero lo que vence primero (FEFO) o lo que entró primero (PEPS). Los productos nuevos van detrás o debajo.</li>\n<li>Mantenga el <b>reempaque</b> y las bolsas rotas controlados; no deje producto suelto en el piso.</li></ul>"}, {"t": "4. Manejo seguro de fertilizantes", "for": ["fert"], "h": "<ul><li>Lea la <b>etiqueta y la ficha de seguridad</b> (SDS) de cada producto: composición, riesgos y primeros auxilios.</li>\n<li>Almacene alejado de <b>fuentes de calor, llama y materiales combustibles</b>; tenga extintor vigente y visible.</li>\n<li>Muchos fertilizantes absorben humedad y se apelmazan: cierre los empaques y protéjalos del agua.</li>\n<li>No mezcle productos distintos en el mismo estante sin conocer su compatibilidad.</li>\n<li>Use <b>elementos de protección personal</b>: guantes, tapabocas y calzado adecuado. Lávese las manos tras manipular.</li>\n<li>En caso de <b>derrame</b>: recoja en seco y disponga el residuo según la instrucción de la ficha; <b>no lave hacia desagües, quebradas ni fuentes de agua</b>.</li>\n<li>Al cargar bultos pesados, flexione las rodillas y mantenga la espalda recta; pida ayuda si el peso es excesivo.</li></ul>"}, {"t": "4. Seguridad y salud en el punto", "for": ["fiel"], "h": "<ul><li>Use los elementos de protección entregados (guantes, tapabocas, calzado) y reporte condiciones inseguras.</li>\n<li>Manejo manual de cargas: flexione las rodillas, no gire el tronco al levantar, pida ayuda con sacos pesados y use estibas para arrumes seguros.</li>\n<li>Mantenga botiquín y extintor a la vista y al día; conozca la ruta de evacuación.</li>\n<li>El <b>dinero en efectivo</b> es un riesgo de seguridad: no lo exhiba, no anuncie los montos, varíe horarios y rutas de consignación y avise si algo parece sospechoso.</li></ul>"}], "practica": ["Tomé una foto del estado actual de mi bodega o almacén (zona de recibo/estantes) y marqué 3 mejoras de orden o limpieza.", "Verifiqué que ningún producto con olor fuerte (fertilizante, agroquímico, combustible) esté cerca del café o de alimentos.", "Revisé que mi extintor y botiquín estén visibles y vigentes, y que las estibas no superen la altura permitida."], "quiz_comun": [{"q": "¿Se puede almacenar café junto a fertilizantes o agroquímicos?", "o": ["Sí, si están en bultos cerrados", "No: el café absorbe olores y se contamina", "Solo si es poco", "Solo en época de cosecha"], "a": 1, "e": "El café nunca se almacena junto a insumos, combustibles o productos con olor fuerte."}, {"q": "Los bultos deben almacenarse:", "o": ["Directamente en el piso", "Sobre estibas o tarimas, separados de la pared, respetando la altura de estibado", "Contra la pared para ahorrar espacio", "Lo más alto posible"], "a": 1, "e": "Estibas, ventilación y altura máxima evitan humedad, derrumbes y daños."}], "quiz_fiel": [{"q": "¿Por qué se separa el café por calidades, lotes y sellos?", "o": ["Por estética", "Para conservar la trazabilidad y no mezclar cafés distintos", "Para ocupar más espacio", "No se separa"], "a": 1, "e": "La trazabilidad permite saber qué café es, de quién viene y en qué lote está."}, {"q": "El orden correcto del flujo en el punto de compra es:", "o": ["Pago → pesaje → muestra", "Recibo → pesaje → muestra y análisis → liquidación → pago → arrume", "Arrume → pago → pesaje", "Muestra → pago → recibo"], "a": 1, "e": "Un flujo ordenado evita mezclas y errores de pago."}, {"q": "Sobre el efectivo del punto, lo recomendable es:", "o": ["Anunciar los montos a los vecinos", "No exhibirlo, no anunciar montos y variar horarios y rutas de consignación", "Guardarlo en un cajón sin llave", "Dejarlo en la báscula"], "a": 1, "e": "El efectivo es un riesgo de seguridad: discreción y variación de rutinas."}], "quiz_fert": [{"q": "FEFO significa:", "o": ["Sale primero lo que vence primero", "Sale primero lo más caro", "Sale primero lo más pesado", "Sale primero lo más nuevo"], "a": 0, "e": "FEFO: first expired, first out. Reduce vencimientos y pérdidas."}, {"q": "En un derrame de fertilizante, usted:", "o": ["Lo lava hacia el desagüe", "Recoge en seco y dispone el residuo según la ficha de seguridad", "Lo cubre con tierra", "Lo deja secar al sol"], "a": 1, "e": "No se lava hacia desagües ni fuentes de agua: se recoge en seco y se dispone correctamente."}, {"q": "Los productos de mayor rotación deben ubicarse:", "o": ["En el fondo de la bodega", "A la altura de las manos y a la vista, con precio marcado", "En el piso", "Bajo llave"], "a": 1, "e": "Facilitan la venta y el despacho rápido; el precio visible genera confianza."}]}, {"id": 6, "h": 3, "titulo": "Estrategias para vender más y fidelizar clientes", "objetivo": "Aplicar técnicas comerciales éticas para aumentar las compras de café y las ventas de fertilizantes, y fidelizar al caficultor.", "lecciones": [{"t": "1. Conozca su mercado", "for": ["fert"], "h": "<ul><li><b>¿Quiénes son sus clientes?</b> Caficultores de su zona: tamaño de la finca, edad del cultivo, tipo de café. Si no los conoce, empiece a anotarlos.</li>\n<li><b>Calendario de fertilización:</b> los cafetales se fertilizan en épocas definidas por el clima y la cosecha. Prepare existencias y campañas <b>antes</b> de esas épocas, no cuando ya se agotaron los productos.</li>\n<li><b>Estudio de precios:</b> conozca los precios de la competencia en el municipio y repórtelos a la dirección comercial.</li>\n<li><b>Aprenda de los técnicos</b> de la cooperativa o del Servicio de Extensión: su recomendación técnica es su mejor argumento de venta.</li></ul>"}, {"t": "2. Venta consultiva: asesorar antes que vender", "for": ["fert"], "h": "<p>El caficultor no compra “un bulto”, compra <b>la solución a una necesidad de su cultivo</b>. Antes de ofrecer un producto, pregunte:</p>\n<ul><li>¿Cuántos árboles o hectáreas? ¿De qué edad es el cultivo?</li>\n<li>¿Tiene análisis de suelo o recomendación técnica?</li>\n<li>¿Cuándo fue la última fertilización y con qué?</li></ul>\n<p>Con esa información recomiende la cantidad y el producto adecuados. <b>No venda de más</b>: un exceso de fertilizante no rinde más y le hace perder confianza al cliente. Si no sabe, consulte con el técnico.</p>"}, {"t": "3. Venta cruzada, crédito y compra con café", "for": ["fert"], "h": "<ul><li><b>Venta sugerida:</b> si compra fertilizante, ofrezca lo que lo complementa (enmiendas, herramientas, equipos, otros productos del portafolio) siempre que le sirva de verdad.</li>\n<li><b>Crédito y pago con café:</b> si la cooperativa ofrece fertilizante a crédito, cupo o pago contra entrega de café, <b>explíquelo con claridad y solo en las condiciones aprobadas</b> por la gerencia. No improvise plazos ni descuentos.</li>\n<li><b>Cartera:</b> una venta no está terminada hasta que se cobra. Lleve control de fechas de pago y cobre con cortesía y a tiempo.</li>\n<li><b>Descuentos:</b> solo los autorizados por la cooperativa.</li></ul>"}, {"t": "4. Promoción y fidelización", "for": ["fert"], "h": "<ul><li><b>Campañas de temporada</b> antes de las épocas de fertilización, con precio visible y mensaje simple.</li>\n<li><b>Combos y descuentos por volumen</b> autorizados.</li>\n<li><b>Base de clientes</b> con autorización de datos: avise por WhatsApp de ofertas, llegadas de mercancía y fechas de campaña.</li>\n<li><b>Días de campo y charlas técnicas</b> con los técnicos de la cooperativa.</li>\n<li><b>Referidos:</b> un cliente satisfecho que trae a otro es la mejor publicidad.</li>\n<li>Una exhibición ordenada, con cartel y precio, vende más que el mismo producto escondido.</li></ul>"}, {"t": "5. Mida para mejorar: indicadores del almacén", "for": ["fert"], "h": "<table><tr><th>Indicador</th><th>Qué le dice</th></tr>\n<tr><td>Ventas diarias y semanales</td><td>Si va hacia la meta</td></tr>\n<tr><td>Ticket promedio (venta ÷ número de facturas)</td><td>Cuánto compra cada cliente por visita</td></tr>\n<tr><td>Rotación de inventario</td><td>Qué se vende rápido y qué se queda quieto</td></tr>\n<tr><td>Quiebres de inventario (agotados)</td><td>Ventas perdidas por falta de producto</td></tr>\n<tr><td>Clientes nuevos y recurrentes</td><td>Si está creciendo y fidelizando</td></tr>\n<tr><td>Cartera vencida</td><td>Calidad de la venta a crédito</td></tr></table>\n<p>Lleve estos números cada semana; lo que no se mide, no se mejora.</p>"}, {"t": "1. Qué hace que el caficultor le venda su café a {{corto}}", "for": ["fiel"], "h": "<ul><li><b>Precio del día claro y visible</b>, el mismo para todos.</li>\n<li><b>Buen peso y buena medida</b>, hechos a la vista del productor y con explicación.</li>\n<li><b>Rapidez</b>: poca fila, atención ágil y respeto por el tiempo del productor.</li>\n<li><b>Pago oportuno</b> y completo, con factura entregada.</li>\n<li><b>Trato respetuoso</b> y reconocimiento al cliente frecuente.</li>\n<li><b>Información útil</b>: precios, calidad exigida, programas de la cooperativa, servicios y beneficios.</li></ul>\n<p>La competencia puede igualar un precio, pero no tan fácil la confianza que usted construye.</p>"}, {"t": "2. Cómo captar y mantener más café", "for": ["fiel"], "h": "<ul><li><b>Conozca a sus proveedores:</b> quiénes son, cuánto producen, cuándo cosechan. Anote y haga seguimiento.</li>\n<li><b>Avise antes de la cosecha</b> (por llamada o WhatsApp, con autorización) el horario y las condiciones de compra.</li>\n<li><b>Mensaje de precio del día</b> claro y puntual a los clientes que lo hayan autorizado.</li>\n<li>Oriente sobre <b>calidad</b>: un café bien beneficiado se paga mejor y beneficia a todos.</li>\n<li><b>Dé a conocer los servicios</b> de {{corto}}: insumos, crédito, asistencia técnica, tienda y beneficios para asociados.</li>\n<li><b>Informe a la gerencia</b> lo que ve en la competencia (precios, horarios, promociones).</li></ul>"}, {"t": "3. Café, fertilizante y fidelización", "for": ["fiel"], "h": "<ul><li>El mismo caficultor que vende su café puede comprar abono en la cooperativa. <b>Recuérdele</b> que el punto de venta de insumos de {{corto}} existe y qué facilidades de pago hay, siempre dentro de las condiciones aprobadas por la gerencia.</li>\n<li>Lleve un <b>registro simple</b> de sus mejores proveedores de café y salúdelos por su nombre.</li>\n<li><b>Nunca prometa</b> precios, anticipos, créditos o descuentos que usted no esté autorizado a ofrecer.</li>\n<li>Una buena experiencia hoy asegura el café de la próxima cosecha.</li></ul>"}, {"t": "6. Ética comercial: vender sin perder la confianza", "h": "<ul><li>Competimos con <b>servicio y calidad</b>, no con engaños: nada de hablar mal de la competencia ni de ofrecer lo que no se tiene.</li>\n<li>No presione ni “empuje” productos que el cliente no necesita.</li>\n<li>Todo descuento, crédito o condición especial debe estar <b>autorizado por la cooperativa</b> y quedar en el documento.</li>\n<li>Los datos de los clientes son confidenciales.</li></ul>\n<div class=\"tip\">Meta de largo plazo: que el caficultor piense primero en {{corto}} para vender su café, comprar su abono y recibir asesoría.</div>"}], "practica": ["Escribí una lista de mis 10 clientes más frecuentes y qué compran o venden normalmente.", "Diseñé una acción concreta para esta semana (cartel, mensaje por WhatsApp autorizado, exhibición u oferta aprobada) para aumentar mis ventas o compras.", "Hablé con mi jefe inmediato sobre las condiciones de crédito, descuentos o beneficios que sí puedo ofrecer."], "quiz_comun": [{"q": "Un descuento o crédito especial que usted quiere ofrecer a un cliente:", "o": ["Se ofrece sin avisar si el cliente insiste", "Debe estar autorizado por la cooperativa y quedar en el documento", "Lo define cada empleado", "Se paga de su bolsillo"], "a": 1, "e": "Solo se ofrecen condiciones aprobadas por la gerencia, y siempre quedan soportadas."}, {"q": "Su competencia ofrece un precio menor. Lo recomendable es:", "o": ["Igualar el precio por su cuenta", "Mostrar el valor de la cooperativa (servicio, asesoría, confianza) e informar a la gerencia", "Hablar mal de la competencia", "No hacer nada"], "a": 1, "e": "Compita con servicio y valor, e informe a la gerencia para que decida sobre precios."}], "quiz_fiel": [{"q": "¿Qué ayuda más a que el productor siga vendiendo su café a la cooperativa?", "o": ["Precio claro, buen peso, atención rápida y pago oportuno", "Promesas de precio que no puede cumplir", "Atender solo a los grandes productores", "Cambiar las reglas cada día"], "a": 0, "e": "La confianza se construye con transparencia, rapidez y cumplimiento."}, {"q": "Una buena práctica con el caficultor frecuente es:", "o": ["No saludarlo", "Llevar un registro simple y saludarlo por su nombre", "Hacerlo esperar", "Cobrarle más"], "a": 1, "e": "Reconocer al cliente frecuente fideliza."}, {"q": "Para mandar mensajes de precio del día por WhatsApp debe:", "o": ["Mandarlos a toda la lista sin preguntar", "Tener autorización de los clientes y mensajes claros y puntuales", "Compartir el celular de todos en un grupo público", "No mandarlos nunca"], "a": 1, "e": "La autorización protege los datos personales y la relación con el cliente."}], "quiz_fert": [{"q": "Antes de recomendar un fertilizante, lo primero es:", "o": ["Ofrecer el más caro", "Preguntar por la edad del cultivo, el área y si hay análisis de suelo o recomendación técnica", "Preguntar cuánto dinero tiene", "Ofrecer lo que más hay en bodega"], "a": 1, "e": "La venta consultiva busca la solución adecuada, no solo mover producto."}, {"q": "La mejor época para lanzar una campaña de fertilizantes es:", "o": ["Cuando el cliente ya aplicó", "Antes de las épocas de fertilización, con existencias listas", "Al final de la cosecha", "Nunca, el producto se vende solo"], "a": 1, "e": "Hay que anticiparse al calendario de aplicación para evitar quiebres y perder ventas."}, {"q": "¿Qué indicador muestra las ventas perdidas por falta de producto?", "o": ["Los quiebres de inventario (agotados)", "El ticket promedio", "El número de clientes", "La cartera"], "a": 0, "e": "Un quiebre implica que el cliente quiso comprar y no encontró."}]}];
const CFG={MIN_RATIO:0.25,PASS:0.8,HORAS:16,SALT:"cl-2026-Pz7"};
const DEMO=new URLSearchParams(location.search).has('demo');
if(DEMO)CFG.MIN_RATIO=0;
const TRACKS={fiel:'Fiel (administrador de punto de compra de café)',fert:'Encargado de venta de fertilizantes',adm:'Personal administrativo'};
/* ---------- Rol administrativo (agregado 25-nov-2026) ---------- */
(function(){
  const M=id=>MODS.find(m=>m.id===id);
  const setFor=(m,pref,f)=>{const l=m.lecciones.find(x=>x.t.indexOf(pref)===0&&!x.for);if(l)l.for=f;};
  const addAfter=(m,pref,arr)=>{let i=m.lecciones.findIndex(x=>x.t.indexOf(pref)===0);if(i<0)i=m.lecciones.length-1;m.lecciones.splice(i+1,0,...arr);};
  const A=['adm'];
  const L=(t,h)=>({t:t,h:h,for:A});

  // Prácticas propias del rol administrativo
  M(1).practica_adm=["Ubiqué en mi puesto de trabajo el Código de Ética y Buen Gobierno (impreso o digital) y leí los valores y las conductas prohibidas.","Identifiqué con mi jefe inmediato a quién debo reportar una operación sospechosa o una irregularidad.","Revisé que en mi oficina no haya dinero personal mezclado con el de la cooperativa, ni documentos o claves a la vista."];
  M(2).practica_adm=["Escribí en una hoja las 5 funciones que más hago en la semana y verifiqué cuáles de ellas están en el manual de funciones de mi cargo.","Identifiqué, en los procesos de mi área, qué tareas autorizo, cuáles ejecuto y cuáles registro, y si alguna la hago yo sola(o) de principio a fin.","Verifiqué quién es mi jefe inmediato y a quién informo cada novedad."];
  M(3).practica_adm=["Revisé que los documentos de mi área del último mes (facturas, comprobantes de pago, consignaciones, cotizaciones y contratos) estén completos y archivados por fecha.","Verifiqué que en mis procesos quien autoriza, quien paga y quien registra sean personas distintas, o informé a mi jefe inmediato cuando no es así.","Confirmé que ningún pago o compra de mi área se haya hecho sin soporte y sin la autorización correspondiente."];
  M(4).practica_adm=["Observé durante un día cómo atiendo a los asociados y proveedores que llaman o llegan a la oficina: saludo por su nombre, explico y doy una respuesta clara.","Revisé que los datos de contacto y los horarios de la cooperativa estén visibles y actualizados en mi área.","Anoté una queja, solicitud o sugerencia reciente y qué hice para resolverla o a quién la trasladé."];
  M(5).practica_adm=["Tomé una foto de mi puesto de trabajo y de mi archivo y marqué 3 mejoras de orden o limpieza.","Verifiqué que los documentos con información reservada (nómina, contratos, datos de asociados) estén bajo llave o con acceso restringido y que no queden a la vista cuando me ausento.","Confirmé que conozco la ruta de evacuación y la ubicación del extintor y del botiquín, y realicé mis pausas activas."];
  M(6).practica_adm=["Escribí los 5 trámites o servicios que los asociados y los puntos más me solicitan y cuánto tardo en responder cada uno.","Definí una acción concreta para esta semana para responder más rápido o mejor a un asociado o a un punto (por ejemplo, una lista de respuestas frecuentes o un recordatorio de cierres).","Hablé con mi jefe inmediato sobre qué información o reportes de mi área ayudan a los puntos a vender y comprar más."];

  // Módulo 2: funciones y responsabilidades
  setFor(M(2),'4.',['fiel','fert']);
  M(2).lecciones.push(
    L("1. Propósito de mi cargo administrativo","<p>El <b>personal administrativo</b> (secretaría, contabilidad, tesorería, coordinación y auxiliares de oficina) <b>sostiene la operación</b> de los fielatos y almacenes: registra lo que ellos compran y venden, paga a proveedores y asociados, contrata, archiva y reporta a la gerencia, al Consejo y a los organismos de control.</p>\n<p>Su trabajo no se ve en el mostrador, pero de él dependen la <b>exactitud de las cifras</b>, la <b>oportunidad de los pagos</b> y la <b>confianza</b> de los asociados en {{corto}}.</p>\n<div class=\"tip\"><b>Lo que esto significa para usted:</b> un error de registro o un pago sin soporte en la oficina se refleja en todos los puntos de la cooperativa.</div>"),
    L("2. Funciones según el área de trabajo","<p>Las funciones exactas de su cargo están en el <b>manual de funciones</b> y en su contrato. De manera general, el trabajo administrativo se organiza así:</p>\n<ul><li><b>Secretaría y archivo:</b> correspondencia, actas, cotizaciones y archivo ordenado de los documentos de la cooperativa.</li>\n<li><b>Contabilidad:</b> registro oportuno y completo de las operaciones, conciliaciones, cumplimiento de las obligaciones tributarias y preparación de la información financiera, siempre con soporte.</li>\n<li><b>Tesorería:</b> recaudo, pagos, consignaciones y manejo de la caja y de las cuentas bancarias, con comprobante.</li>\n<li><b>Coordinación de café y comercial:</b> seguimiento a los puntos de compra y de venta, revisión de los cierres diarios y apoyo a los fieles y encargados.</li></ul>\n<p>Si usted cumple varias de estas funciones, le aplican las reglas de todas ellas.</p>"),
    L("3. Separación de funciones: quien autoriza no paga ni registra","<p>Para que un error o un fraude no pase sin ser visto, las tareas críticas se reparten entre <b>personas distintas</b>:</p>\n<ul><li>Quien <b>autoriza</b> un gasto no es quien lo <b>paga</b>.</li>\n<li>Quien <b>maneja el dinero</b> no es quien lo <b>registra</b> en la contabilidad.</li>\n<li>Quien <b>recibe</b> mercancía o servicios no es quien <b>aprueba el pago</b>.</li>\n<li>Quien <b>revisa</b> el cierre de caja de un punto no es quien lo prepara.</li></ul>\n<div class=\"tip\"><b>Si en su área una sola persona hace todo el ciclo</b> (autoriza, paga y registra), no es una muestra de confianza: es un riesgo. Infórmelo a su jefe inmediato para que se defina un control que lo compense.</div>"),
    L("4. Niveles de responsabilidad en la oficina","<p>Soy responsable de la <b>veracidad</b> de la información que registro y reporto: contabilidad, cuentas por pagar, conciliaciones e informes. Esta responsabilidad no se delega: puedo apoyarme en auxiliares, pero sigo respondiendo por lo que firmo o apruebo.</p>\n<ul><li>Soy responsable de la <b>custodia</b> de los documentos, las claves, las firmas y el dinero a mi cargo. Las <b>claves y usuarios de los sistemas son personales e intransferibles</b>.</li>\n<li>Soy responsable de entregar la información a la Revisoría Fiscal, a la gerencia y a los organismos de control de forma <b>completa y a tiempo</b>.</li>\n<li>Soy responsable de cumplir las normas del SG-SST y las políticas de la cooperativa.</li></ul>\n<p>Entregar un cargo, la caja, las llaves o el archivo a otra persona <b>sin acta, inventario y firma</b> puede dejarlo respondiendo por situaciones que usted no causó.</p>")
  );
  M(2).adm_solo=true;
  M(2).quiz_adm=[
    {q:"El gasto de la cooperativa debe ser autorizado por:",o:["La misma persona que lo paga y lo registra, para ir más rápido","Una persona distinta de quien lo paga y de quien lo registra","Siempre el auxiliar de oficina","Cualquier proveedor"],a:1,e:"La separación de funciones evita que un error o un fraude pase sin ser detectado."},
    {q:"Su clave del sistema contable:",o:["Se presta a un compañero cuando hay afán","Es personal e intransferible: usted responde por lo que se haga con ella","Se deja escrita en un lugar visible de la oficina","Se comparte con los proveedores"],a:1,e:"Los usuarios y claves son personales; lo que se haga con ellos queda a su nombre."},
    {q:"Al entregar su cargo, la caja o el archivo a otra persona:",o:["Basta con avisarle de palabra","Se hace con acta, inventario o conteo y firma de ambos","Se deja en un cajón y listo","Se entrega al vigilante"],a:1,e:"Sin acta y firma, usted podría responder por situaciones que no causó."},
    {q:"Usted descubre que en su área una sola persona autoriza, paga y registra. Lo correcto es:",o:["Ignorarlo, es una persona de confianza","Informarlo a su jefe inmediato para que se defina un control","Comentarlo con los proveedores","Modificar los registros para ajustarlos"],a:1,e:"Es un riesgo de control interno que debe informarse para que se corrija o se compense."},
    {q:"Las funciones exactas de su cargo están:",o:["Solo en lo que le cuente un compañero","En el manual de funciones y en su contrato","En ninguna parte","En las redes sociales"],a:1,e:"El manual de funciones y el contrato definen sus responsabilidades."}
  ];

  // Módulo 3: control interno (se suma una lección y 2 preguntas al banco común)
  addAfter(M(3),'3.',[L("4. Compras, contratación y conflicto de interés","<p>Comprar un bien o contratar un servicio compromete el dinero de los asociados. Por eso el proceso debe quedar <b>documentado y justificado</b>:</p>\n<ul><li>Haga <b>cotizaciones</b> y compárelas por escrito antes de decidir; guarde el cuadro comparativo en el archivo.</li>\n<li>Aplique los <b>montos, requisitos y niveles de autorización</b> que defina la cooperativa: la decisión de adjudicar la toma quien tiene la autoridad, no quien cotiza.</li>\n<li>El contrato u <b>orden de compra firmada</b> se elabora <b>antes</b> de que el servicio empiece, con valor, plazo y obligaciones.</li>\n<li>El pago se hace contra <b>factura o documento equivalente</b> y constancia de recibido a satisfacción.</li></ul>\n<p><b>Conflicto de interés:</b> existe cuando una decisión de la cooperativa puede favorecerle a usted, a un familiar o a un amigo. Si es su caso, <b>declárelo por escrito</b> y apártese de esa decisión.</p>\n<div class=\"tip\"><b>Regla práctica:</b> si no le gustaría ver la decisión explicada ante el Consejo, no la tome sola(o).</div>")]);
  M(3).quiz_adm=[
    {q:"Antes de decidir una compra de importancia, lo correcto es:",o:["Pedir una sola cotización a un conocido","Comparar cotizaciones por escrito y dejar el soporte en el archivo","Decidir de palabra y legalizar después","Comprar donde ofrezcan regalos"],a:1,e:"La comparación escrita de cotizaciones justifica la decisión y protege a quien la toma."},
    {q:"Un familiar suyo ofrece un servicio a la cooperativa. Usted debe:",o:["Contratarlo sin decir nada porque es de confianza","Declarar el conflicto de interés por escrito y apartarse de esa decisión","Pedirle que facture a nombre de un tercero","Esperar a que alguien pregunte"],a:1,e:"El conflicto de interés se declara y la persona se aparta de la decisión."}
  ];

  // Módulo 5: orden, información y seguridad en la oficina
  setFor(M(5),'2.',['fiel','fert']);
  M(5).lecciones.push(
    L("3. Oficina y archivo ordenados","<p>Un puesto de trabajo ordenado evita errores, pérdida de documentos y retrasos en los pagos y en los reportes.</p>\n<ul><li><b>Un lugar para cada documento:</b> archivo por año, tipo y fecha, con carpetas rotuladas.</li>\n<li><b>Escritorio despejado</b> al terminar el día: sin dinero, cheques, claves ni documentos sueltos a la vista.</li>\n<li>Los <b>originales</b> se conservan en el archivo; para consultar se usan copias o escaneos.</li>\n<li>Los <b>respaldos</b> de la información digital se hacen con la frecuencia que indique la cooperativa y se guardan fuera del equipo.</li></ul>\n<div class=\"tip\"><b>Recuerde:</b> la Revisoría Fiscal y los organismos de control pueden pedir cualquier soporte en cualquier momento; si no se encuentra, es como si no existiera.</div>"),
    L("4. Información reservada y seguridad de la información","<p>El personal administrativo conoce datos sensibles: nómina, contratos, cuentas bancarias y datos de los asociados. Por eso:</p>\n<ul><li>Use <b>claves personales</b>, cámbielas periódicamente y no las comparta ni las deje escritas a la vista.</li>\n<li><b>Bloquee</b> el computador cada vez que se levante del puesto.</li>\n<li>No saque información de la cooperativa en memorias USB, correos personales o fotos del celular sin autorización.</li>\n<li>Los datos personales se usan solo para la finalidad para la que fueron recogidos (Ley 1581 de 2012) y no se entregan a terceros sin autorización.</li>\n<li>Desconfíe de correos o mensajes que piden claves, pagos urgentes o cambios de cuenta bancaria: <b>verifique siempre por otro medio</b> antes de actuar.</li></ul>"),
    L("5. Seguridad y salud en la oficina","<p>Cumpla el <b>SG-SST</b> de la cooperativa:</p>\n<ul><li>Cuide su postura y haga <b>pausas activas</b> en el trabajo prolongado frente al computador; ajuste la pantalla y la silla.</li>\n<li>Mantenga cables, cajas y archivos <b>fuera de las vías de paso</b>, y las salidas y rutas de evacuación despejadas.</li>\n<li>Conozca la ubicación y el uso del <b>extintor</b> y del <b>botiquín</b>, y la ruta de evacuación.</li>\n<li>Reporte a su jefe inmediato los actos y condiciones inseguras y cualquier accidente.</li></ul>")
  );
  M(5).adm_solo=true;
  M(5).quiz_adm=[
    {q:"Al terminar la jornada, el escritorio del personal administrativo debe:",o:["Quedar con cheques y claves a la vista para el día siguiente","Quedar despejado, sin dinero, claves ni documentos sueltos a la vista","Quedar con el computador desbloqueado","Quedar igual: no importa"],a:1,e:"Un escritorio despejado protege el dinero, las claves y la información reservada."},
    {q:"Al levantarse del puesto de trabajo, el computador debe:",o:["Quedar abierto con el sistema contable","Bloquearse","Prestarse a un visitante","Dejarse encendido sin bloqueo para que otros consulten"],a:1,e:"Bloquear el equipo evita que otra persona use su usuario."},
    {q:"Llega un correo que pide con urgencia cambiar la cuenta de pago de un proveedor. Usted:",o:["Hace el cambio de inmediato","Verifica por otro medio (por ejemplo, llamando a un número conocido) y con quien corresponde antes de actuar","Responde enviando sus claves","Lo reenvía a todos sus compañeros"],a:1,e:"Los cambios de cuenta y los pagos urgentes por correo son una modalidad frecuente de fraude: se verifican por otro medio."},
    {q:"Los datos personales de los asociados se pueden usar:",o:["Para cualquier fin","Solo para la finalidad autorizada y sin entregarlos a terceros sin autorización","Para publicarlos en redes sociales","Para venderlos"],a:1,e:"La Ley 1581 de 2012 exige usar los datos solo para la finalidad autorizada."},
    {q:"Las pausas activas sirven para:",o:["Perder tiempo de trabajo","Prevenir lesiones y fatiga en el trabajo prolongado frente al computador","Reemplazar el almuerzo","Nada en particular"],a:1,e:"Hacen parte del SG-SST y previenen lesiones por postura y esfuerzo repetitivo."}
  ];

  // Módulo 6: servicio y apoyo comercial desde la oficina

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sub=s=>String(s).replace(/\{\{corto\}\}/g,COOP.corto).replace(/\{\{nombre\}\}/g,COOP.nombre).replace(/\{\{pos\}\}/g,COOP.pos);
function norm(s){return (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();}
function cyrb53(str,seed){seed=seed||0;let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
function hcode(parts){return cyrb53([CFG.SALT,COOP.id].concat(parts).join('|')).toString(36).toUpperCase().padStart(10,'0').slice(-8);}
function codMod(ced,nom,i,demo){return (demo?'DEMO-':'')+COOP.sigla+'-M'+i+'-'+hcode([ced,norm(nom),'M'+i,demo?'D':'']);}
function codCert(ced,nom,demo){return (demo?'DEMO-':'')+COOP.sigla+'-CERT-'+hcode([ced,norm(nom),'CERT',CFG.HORAS,demo?'D':'']);}
function key(c){return 'cap_'+COOP.id+'_'+c;}
function load(c){try{const r=localStorage.getItem(key(c));return r?JSON.parse(r):null}catch(e){return mem[c]||null}}
function save(){try{localStorage.setItem(key(S.p.cedula),JSON.stringify(S));localStorage.setItem('cap_'+COOP.id+'_last',S.p.cedula)}catch(e){mem[S.p.cedula]=JSON.parse(JSON.stringify(S))}}
function fmtT(sec){const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return (h?h+' h ':'')+m+' min';}
function fmtDate(d){return new Date(d).toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'});}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pr(m){return (S.p.track==='adm'&&m.practica_adm)||m.practica;}
function lessons(m){return m.lecciones.filter(l=>S.p.track==='adm'||!l.for||l.for.includes(S.p.track));}
function req(l){return !l.for||l.for.includes(S.p.track);}
function rolTag(l){if(S.p.track!=='adm'||!l.for)return '';const f=l.for.join(',');return f==='adm'?' · Administrativo':f==='fiel'?' · Fiel (opcional)':f==='fert'?' · Encargado de fertilizantes (opcional)':' · Fiel y encargado (opcional)';}
function quiz(m){if(m.quiz)return m.quiz;if(S.p.track==='adm'&&m.quiz_adm)return m.adm_solo?m.quiz_adm:(m.quiz_comun||[]).concat(m.quiz_adm);return (m.quiz_comun||[]).concat(m['quiz_'+S.p.track]||[]);}
function ms(i){S.m[i]=S.m[i]||{read:{},prac:{},t:0,ok:false};return S.m[i];}
function progress(){return MODS.filter(m=>ms(m.id).ok).length;}
function allOk(){return progress()===MODS.length;}
function horasOk(){return MODS.filter(m=>ms(m.id).ok).reduce((a,m)=>a+m.h,0);}
function minSec(m){return Math.round(m.h*3600*CFG.MIN_RATIO);}

   h+=`<details ${i===0&&!st.read[0]?'open':''}><summary><span>${i+1}. ${esc(t)}${esc(rolTag(l))}</span><span class="read">${st.read[i]?'✓ leída':''}</span></summary><div class="lbody">${sub(l.h)}<button onclick="leida(${m.id},${i})">${st.read[i]?'Leída ✓':'Marcar como leída'}</button></div></details>`;});
  h+=`<div class="card"><h3>Práctica en mi punto</h3><p class="small">Marque cada actividad cuando la haya realizado de verdad en su punto.</p>${pr(m).map((p,i)=>`<label class="chk"><input type="checkbox" ${st.prac[i]?'checked':''} onchange="prac(${m.id},${i},this.checked)"><span>${esc(sub(p))}</span></label>`).join('')}</div>`;
  h+=`<div class="card"><h3>Evaluación del módulo</h3><p class="small">Se habilita cuando lea todas las lecciones, complete la práctica y cumpla el tiempo mínimo. Se aprueba con ${Math.round(CFG.PASS*100)}%.</p><button id="qbtn" onclick="go('quiz')" disabled>Presentar evaluación</button>${st.ok?'<p>Ya aprobó este módulo. Código: <b>'+esc(st.codigo)+'</b></p>':''}</div>`;
  setTimeout(tmrUpdate,0);return h;
}
function leida(mid,i){ms(mid).read[i]=true;save();render0(mid);}
function prac(mid,i,v){ms(mid).prac[i]=v;save();tmrUpdate();}
function render0(mid){const y=window.scrollY;view='mod';curMod=mid;const keep=[...document.querySelectorAll('details')].map(d=>d.open);$('#app').innerHTML=modHTML();document.querySelectorAll('details').forEach((d,i)=>d.open=keep[i]);window.scrollTo(0,y);}
let QS=null;
function quizHTML(){
  const m=MODS.find(x=>x.id===curMod);
  QS=quiz(m).map(q=>({q:q.q,e:q.e,o:shuffle(q.o.map((t,i)=>({t,ok:i===q.a})))}));
  return `<div class="card"><button class="sec" onclick="go('mod',${m.id})">← Volver al módulo</button><h2>Evaluación – Módulo ${m.id}</h2><p class="small">${QS.length} preguntas. Aprueba con ${Math.round(CFG.PASS*100)}% (${Math.ceil(QS.length*CFG.PASS)} correctas).</p></div>
  <div id="qs">${QS.map((q,i)=>`<div class="q" id="q${i}"><b>${i+1}. ${esc(q.q)}</b>${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="r${i}" value="${j}"><span>${esc(o.t)}</span></label>`).join('')}<div class="exp" id="e${i}"></div></div>`).join('')}</div>
  <button id="sbtn" onclick="calificar()">Enviar respuestas</button><div id="res"></div>`;
}
function calificar(){
  const m=MODS.find(x=>x.id===curMod);let ok=0;
  for(let i=0;i<QS.length;i++){if(!document.querySelector('input[name=r'+i+']:checked')){alert('Responda todas las preguntas (falta la '+(i+1)+').');return;}}
  QS.forEach((q,i)=>{const v=+document.querySelector('input[name=r'+i+']:checked').value,good=q.o[v].ok;if(good)ok++;const el=$('#q'+i);el.classList.add(good?'ok':'bad');$('#e'+i).innerHTML=(good?'✔ Correcto. ':'✘ Incorrecto. ')+esc(q.e);});
  const nota=Math.round(ok/QS.length*100),st=ms(m.id);st.intentos=(st.intentos||0)+1;
  $('#sbtn').style.display='none';
  if(ok/QS.length>=CFG.PASS-1e-9){
    if(!st.ok){st.ok=true;st.nota=nota;st.fecha=new Date().toISOString();st.codigo=codMod(S.p.cedula,S.p.nombre,m.id,DEMO);}
    if(allOk()&&!S.fin){S.fin={fecha:new Date().toISOString(),codigo:codCert(S.p.cedula,S.p.nombre,DEMO)};}
    save();
    $('#res').innerHTML=`<div class="card" style="border:3px solid var(--ok)"><h2>✅ Módulo aprobado: ${nota}%</h2><p>Su código de este módulo es:</p><div class="codebox">${esc(st.codigo)}</div><p class="small">Guárdelo y envíelo a la cooperativa como evidencia. También queda registrado en su panel.</p><button onclick="go('panel')">Continuar</button></div>`;
  }else{
    save();
    $('#res').innerHTML=`<div class="card" style="border:3px solid var(--bad)"><h2>No aprobó: ${nota}%</h2><p>Repase las lecciones y vuelva a intentarlo. Las preguntas cambian de orden en cada intento.</p><button onclick="go('mod',${m.id})">Repasar módulo</button><button class="sec" onclick="go('quiz')">Intentar de nuevo</button></div>`;
  }
  $('#res').scrollIntoView({behavior:'smooth'});
}

   <div class="nm">${esc(S.p.nombre.toUpperCase())}</div>
   <div>identificado(a) con cédula de ciudadanía No. <b>${esc(Number(S.p.cedula).toLocaleString('es-CO'))}</b>, en calidad de <b>${TRACKS[S.p.track]}</b>, punto <b>${esc(S.p.punto)}</b>,</div>
   <div style="margin-top:8px">completó satisfactoriamente el <b>Programa de formación para fieles, encargados de venta de fertilizantes y personal administrativo</b>, en modalidad virtual, con una intensidad de <b style="font-size:20px">${CFG.HORAS} horas</b>, aprobando las evaluaciones de los siguientes módulos:</div>
   <table>${MODS.map(m=>'<tr><td>Módulo '+m.id+'. '+esc(sub(m.titulo))+'</td><td>'+m.h+' h</td><td>'+ms(m.id).nota+'%</td></tr>').join('')}</table>
   <div>Se expide en ${esc(COOP.ciudad.split(',')[0])}, el ${fmtDate(S.fin.fecha)}.</div>
   <div class="firma"><div><img src="firma-gerente-${COOP.id}.png" alt="" onerror="this.style.display='none'"><div class="ln"><b>${esc(COOP.gerente)}</b><br>Gerente – Representante Legal<br>${esc(COOP.corto)}</div></div></div>
   <div class="vcode">Código de verificación: <b>${esc(S.fin.codigo)}</b> · Tiempo efectivo registrado en la plataforma: ${fmtT(tt)}${DEMO?' · <b>DOCUMENTO DE PRUEBA SIN VALIDEZ</b>':''}</div>
  </div>`;
}
function guardarPDF(){const n='Certificado '+S.p.nombre.replace(/[^\wáéíóúñÁÉÍÓÚÑ ]/g,'')+' '+S.p.cedula+'.pdf';window.capDesktop.savePDF(n).then(r=>{if(r&&r.ok)alert('Certificado guardado en:\n'+r.path);else if(r&&r.error)alert('No se pudo guardar el PDF. Use el botón «Imprimir».');});}
function verHTML(){
  return `<div class="card"><button class="sec" onclick="go(S?'panel':'home')">← Volver</button><h2>Verificar código</h2><p class="small">Para uso de la cooperativa. Escriba los datos tal como los reportó el colaborador.</p>
  <label>Nombre completo</label><input id="v_nom"><label>Cédula</label><input id="v_ced" inputmode="numeric"><label>Código (de módulo o de certificado)</label><input id="v_cod" style="text-transform:uppercase">
  <button onclick="verificar()">Verificar</button><div id="v_res"></div></div>`;
}
function verificar(){
  const nom=$('#v_nom').value,ced=$('#v_ced').value.replace(/\D/g,''),cod=$('#v_cod').value.trim().toUpperCase();
  let res='';
  for(const demo of [false,true]){
    if(cod===codCert(ced,nom,demo)){res=`✅ Certificado AUTÉNTICO para ${esc(nom)} (C.C. ${esc(ced)}): ${CFG.HORAS} horas${demo?' — ⚠ código de PRUEBA':''}.`;break;}
    for(const m of MODS){if(cod===codMod(ced,nom,m.id,demo)){res=`✅ Código AUTÉNTICO: módulo ${m.id} («${esc(sub(m.titulo))}») aprobado por ${esc(nom)}${demo?' — ⚠ código de PRUEBA':''}.`;break;}}
    if(res)break;
  }
  $('#v_res').innerHTML=res?'<div class="tip">'+res+'</div>':'<div class="alert">❌ El código NO coincide con ese nombre y cédula. Verifique que estén escritos igual que en el registro.</div>';
}
function reporte(){
  const l=['REPORTE DE CAPACITACIÓN – '+COOP.corto,'Nombre: '+S.p.nombre,'Cédula: '+S.p.cedula,'Cargo: '+TRACKS[S.p.track],'Punto: '+S.p.punto,'Módulos aprobados: '+progress()+' de '+MODS.length+' ('+horasOk()+' h)'];
  MODS.forEach(m=>{const s=ms(m.id);l.push('M'+m.id+': '+(s.ok?s.codigo+' ('+s.nota+'%)':'pendiente'));});
  if(S.fin)l.push('Certificado: '+S.fin.codigo);
  const t=l.join('\n');
  dlg('<h3>Reporte de avance</h3><p class="small">Copie este mensaje y envíelo por WhatsApp o correo únicamente a la persona designada por la cooperativa.</p><textarea id="rep_t" readonly>'+esc(t)+'</textarea><div class="row"><button id="cpbtn" onclick="copiar(\'rep_t\')">Copiar mensaje</button><button class="sec" onclick="abrirWA()">Abrir WhatsApp (requiere internet)</button><button class="gray" onclick="dlgClose()">Cerrar</button></div>');
}
function abrirWA(){const t=$('#rep_t').value;window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener');}
function exportar(){
  const c=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  dlg('<h3>Exportar progreso</h3><p class="small">Copie este código y guárdelo (por ejemplo, envíelo a su WhatsApp o a su correo). Sirve para continuar en otro computador o en la otra versión de la aplicación.</p><textarea id="exp_t" readonly>'+c+'</textarea><div class="row"><button id="cpbtn" onclick="copiar(\'exp_t\')">Copiar código</button><button class="gray" onclick="dlgClose()">Cerrar</button></div>');
}
function importar(){
  dlg('<h3>Importar progreso</h3><p class="small">Pegue aquí el código que guardó con «Exportar progreso».</p><textarea id="imp_t" autofocus></textarea><div id="imp_e"></div><div class="row"><button onclick="importarOk()">Importar</button><button class="gray" onclick="dlgClose()">Cancelar</button></div>');
}
function importarOk(){
  const c=$('#imp_t').value;if(!c.trim())return;
  try{const st=JSON.parse(decodeURIComponent(escape(atob(c.replace(/\s+/g,'')))));if(!st.p||!st.p.cedula||!st.m)throw 0;S=st;save();dlgClose();go('panel');}catch(e){$('#imp_e').innerHTML='<div class="alert">El código no es válido. Cópielo completo y vuelva a intentarlo.</div>';}
}
function salir(){S=null;go('home');}
/* inicio */
(function(){try{const last=localStorage.getItem('cap_'+COOP.id+'_last');}catch(e){}view='home';S=null;render();
 if(new URLSearchParams(location.search).has('verificar'))go('ver');})();
</script>
